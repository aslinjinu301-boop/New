
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
        }

        .container {
            width: 390px;
            max-width: 100%;
            min-height: 600px;
            padding: 35px ;
            background: #f8fafc;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);



        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
        }

        .created-by {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 12px;
            line-height: 1.6;
        }

        .created-by strong {
            color: #1e3a8a;
            font-size: 14px;
        }

    


    </style>
</head>

<body>
<div class="container">
    <h1>Student Registration</h1>

    <form id="registrationForm" novalidate>
        <label for="name">Student Name</label>
        <input type="text" id="name">
        <div class="error" id="nameError"></div>

        <label for="regno">Register Number</label>
        <input type="text" id="regno">
        <div class="error" id="regnoError"></div>

        <label for="department">Department</label>
        <select id="department">
            <option value="">Select Department</option>
            <option>B.Tech IT</option>
            <option>B.Tech CSE</option>
            <option>B.Tech AI & DS</option>
            <option>B.E ECE</option>
            <option>B.E EEE</option>
        </select>
        <div class="error" id="departmentError"></div>

        <label for="email">Email</label>
        <input type="email" id="email">
        <div class="error" id="emailError"></div>

        <label for="year">Year</label>
        <select id="year">
            <option value="">Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>
        <div class="error" id="yearError"></div>

        <button type="submit">Submit Registration</button>
    </form>

    <div class="created-by">
         Created by<br>

            <strong>@AslinJinu.A</strong><br>
    </div>



<script>

        document.getElementById("registrationForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const student = {
        name: document.getElementById("name").value.trim(),
        regno: document.getElementById("regno").value.trim(),
        department: document.getElementById("department").value,
        email: document.getElementById("email").value.trim(),
        year: document.getElementById("year").value
    };

    const errors = {
        name: "",
        regno: "",
        department: "",
        email: "",
        year: ""
    };

    if (!student.name) {
        errors.name = "Please enter student name.";
    }

    if (!student.regno || !/^[0-9]+$/.test(student.regno)) {
        errors.regno = "Enter a valid register number.";
    }

    if (!student.department) {
        errors.department = "Please select department.";
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(student.email)) {
        errors.email = "Enter a valid email address.";
    }

    if (!student.year) {
        errors.year = "Please select year.";
    }

    let valid = true;

    Object.keys(errors).forEach(function(field) {
        document.getElementById(field + "Error").textContent = errors[field];
        if (errors[field]) valid = false;
    });

    if (!valid) return;

    localStorage.setItem("studentDetails", JSON.stringify(student));

    // Automatically open the second page after successful submission.
    window.location.href = "student-details.html";

});
</script>
</body>
</html>
